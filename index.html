<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>馬內生存模擬器</title>
  <style>
    /* 配色採用角色方案：青藍 (#008ba3)、米白膚色 (#fffaf0)、金黃 (#cfb53b) */
    :root { 
      --primary: #008ba3; 
      --secondary: #00acc1;
      --bg: #fffaf0; 
      --accent: #cfb53b;
      --text: #2c3e50;
      --gray: #78909c;
      
      /* 難度對應顏色 */
      --diff-bg-基礎: #e0f7fa; 
      --diff-bg-低: #e3f2fd; 
      --diff-bg-中: #fff3e0; 
      --diff-bg-高: #ffebee;

      --diff-text-基礎: #006064;
      --diff-text-低: #0d47a1;
      --diff-text-中: #e65100;
      --diff-text-高: #b71c1c;
    }
    
    body { 
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 15px; /* 手機版縮小間距 */
      display: flex; 
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden; /* 防止水平滾動 */
    }
    
    /* 標題區域強化 */
    .header-section { text-align: center; margin-bottom: 35px; width: 100%; box-sizing: border-box; }
    h1 { 
      display: inline-block;
      background: var(--primary); 
      color: white; 
      padding: 12px 80px; 
      border-radius: 15px; 
      box-shadow: 0 4px 15px rgba(0, 139, 163, 0.2);
      margin-bottom: 15px; 
      letter-spacing: 3px; 
      font-size: 1.8em; 
      white-space: normal; /* 允許手機版換行 */
      max-width: 90%; /* 確保標題不超出螢幕 */
      word-wrap: break-word;
    }

    /* 手機版標題優化 */
    @media (max-width: 600px) {
      h1 {
        padding: 12px 30px; 
        font-size: 1.4em;
        letter-spacing: 1px;
      }
      body {
        padding: 10px;
      }
    }

    .subtitle { 
      color: var(--primary); 
      font-size: 0.95em; 
      font-weight: bold; 
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.6);
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
      max-width: 90%;
      box-sizing: border-box;
    }

    /* 網格容器 */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 40px;
      box-sizing: border-box;
    }

    /* 針對超窄螢幕（如 iPhone SE）的調整 */
    @media (max-width: 320px) {
      .quiz-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 小卡片樣式 */
    .mini-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-top: 5px solid var(--accent);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
      height: 160px;
      box-sizing: border-box;
    }
    .mini-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 20px rgba(0, 139, 163, 0.1);
    }
    .mini-card .diff-tag {
      font-size: 0.75em;
      font-weight: bold;
      text-align: right;
      margin-bottom: 8px;
    }
    .mini-card .q-preview {
      font-size: 1.05em;
      font-weight: bold;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 展開模式（Modal） */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(44, 62, 80, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 15px;
      box-sizing: border-box;
    }
    .expanded-card {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 25px;
      padding: 30px 20px;
      border-top: 8px solid var(--accent);
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      position: relative;
      animation: expandIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-height: 90vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    @keyframes expandIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.5em;
      cursor: pointer;
      color: var(--gray);
      z-index: 10;
    }

    /* 對話區域佈局 (展開後) */
    .chat-area { display: flex; align-items: flex-start; margin-top: 15px; margin-bottom: 25px; }
    .person-icon { font-size: 45px; margin-right: 12px; flex-shrink: 0; }
    
    @media (max-width: 480px) {
      .person-icon { font-size: 35px; margin-right: 8px; }
      .expanded-card { padding: 25px 15px; }
    }

    .speech-bubble { 
      position: relative; background: rgba(255, 255, 255, 0.9); border-radius: 20px; 
      padding: 15px 18px; flex-grow: 1; border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .speech-bubble::after { 
      content: ''; position: absolute; left: -10px; top: 15px; 
      border-width: 10px 10px 10px 0; border-style: solid; 
      border-color: transparent white transparent transparent; 
    }
    .situation-inline { font-size: 0.85em; color: var(--gray); margin-bottom: 6px; font-weight: bold; }
    .question-content { font-size: 1.15em; line-height: 1.5; font-weight: bold; }

    /* 回答列表 */
    .answers-container {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed rgba(0,0,0,0.05);
    }
    .answer-item {
      background: #f8fcfd; padding: 12px 15px; border-radius: 12px; margin-bottom: 12px;
      border-left: 4px solid var(--accent); font-size: 0.9em;
    }
    .answer-text { white-space: pre-line; color: #37474f; font-weight: 500; }
    .nickname { font-size: 0.8em; color: var(--gray); margin-left: 8px; }

    /* 下方跳轉按鈕 */
    .nav-section {
      text-align: center; width: 100%; max-width: 500px;
      margin-top: 25px; padding: 20px; font-size: 0.9em; color: #546e7a;
      background: rgba(255, 255, 255, 0.5); border-radius: 15px;
      box-sizing: border-box;
    }
    .link-btn {
      color: var(--primary); text-decoration: none; font-weight: bold; margin-top: 15px;
      display: inline-block; padding: 10px 25px; border: 2px solid var(--primary);
      border-radius: 25px; transition: 0.3s; cursor: pointer;
    }
    .link-btn:hover { background: var(--primary); color: white; }

    /* Loading 轉圈 */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 300;
    }
    .spinner-img { 
      width: 80px; height: 80px; object-fit: cover; border-radius: 50%;
      animation: spin 2s linear infinite; margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: auto; padding: 30px; font-size: 0.8em; color: var(--gray); }
  </style>
</head>
<body>

  <!-- 讀取遮罩 -->
  <div id="loader" class="loading-overlay">
    <img src="1.png" alt="Loading" class="spinner-img" onerror="this.style.display='none'; document.getElementById('fallback-spinner').style.display='block';">
    <div id="fallback-spinner" style="display:none; width:45px; height:45px; border:5px solid rgba(0, 139, 163, 0.1); border-left-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <div style="font-weight: bold; color: var(--primary)">布偶正在整理題目...</div>
  </div>

  <!-- 展開對話框 -->
  <div id="modal" class="modal-overlay" onclick="closeCard(event)">
    <div class="expanded-card" onclick="event.stopPropagation()">
      <div class="close-btn" onclick="closeCard()">✕</div>
      <div id="exp-diff" class="difficulty-tag" style="text-align:right; font-weight:800; font-size:0.85em; margin-bottom:15px;"></div>
      
      <div class="chat-area">
        <div class="person-icon">👤</div>
        <div class="speech-bubble">
          <div id="exp-sit" class="situation-inline"></div>
          <div id="exp-q" class="question-content"></div>
        </div>
      </div>
      
      <div id="exp-answers" class="answers-container"></div>
    </div>
  </div>

  <div class="header-section">
    <h1>馬內生存模擬器</h1>
    <div class="subtitle">
      新手馬內救星！<br>場次前先預習可能會被問什麼奇怪的問題！<br>不知道該怎麼回的話，點擊卡片就能看到其他人的應對方法。
    </div>
  </div>

  <div id="quiz-grid" class="quiz-grid">
    <!-- 網格卡片動態生成 -->
  </div>

  <div class="nav-section">
    遇到了其他沒在上面的問題，或者想提供你的回答方法？<br>
    <a class="link-btn" onclick="goToSubmit()">📝 前往提交介面</a>
  </div>

  <div class="footer">
    網頁製作：狛克
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyE-vk-wEcTqD0LvuVTPmqrjVg2cHjOLxt_J31vaYtKQx02Bm6o4VM6rkuNcQDcg_DMJQ/exec";
  
  let allQuestions = [];

  async function init() {
    try {
      const response = await fetch(`${API_URL}?action=getQA`);
      if (!response.ok) throw new Error('網路回應不正確');
      allQuestions = await response.json();
      allQuestions.sort(() => Math.random() - 0.5);
      document.getElementById('loader').style.display = 'none';
      renderGrid();
    } catch (error) {
      console.error(error);
      document.getElementById('loader').innerHTML = "<div style='color:red;padding:20px;text-align:center;'>載入資料失敗。</div>";
    }
  }

  function renderGrid() {
    const grid = document.getElementById('quiz-grid');
    grid.innerHTML = '';

    allQuestions.forEach((q, index) => {
      const diff = q.difficulty || "基礎";
      const card = document.createElement('div');
      card.className = 'mini-card';
      card.style.backgroundColor = `var(--diff-bg-${diff})`;
      card.onclick = () => openCard(index);

      card.innerHTML = `
        <div class="diff-tag" style="color:var(--diff-text-${diff})">難度：${diff}</div>
        <div class="q-preview" style="color:var(--diff-text-${diff})">「${q.content}」</div>
      `;
      grid.appendChild(card);
    });
  }

  function openCard(index) {
    const q = allQuestions[index];
    const diff = q.difficulty || "基礎";
    const modal = document.getElementById('modal');
    const expCard = document.querySelector('.expanded-card');

    document.getElementById('exp-diff').innerText = "難度：" + diff;
    document.getElementById('exp-diff').style.color = `var(--diff-text-${diff})`;
    document.getElementById('exp-sit').innerText = q.situation ? q.situation : "";
    document.getElementById('exp-sit').style.display = q.situation ? "block" : "none";
    document.getElementById('exp-q').innerText = `「${q.content}」`;
    document.getElementById('exp-q').style.color = `var(--diff-text-${diff})`;
    expCard.style.backgroundColor = `var(--diff-bg-${diff})`;

    const ansContainer = document.getElementById('exp-answers');
    if (q.answers && q.answers.length > 0) {
      ansContainer.innerHTML = q.answers.map(ans => `
        <div class="answer-item">
          <span class="answer-text">「${ans.content}」</span>
          <span class="nickname">${ans.nickname}</span>
        </div>
      `).join('');
    } else {
      ansContainer.innerHTML = '<div style="text-align:center;color:#999;font-size:0.9em;padding:10px;">尚未有精選回答</div>';
    }

    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeCard() {
    document.getElementById('modal').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  function goToSubmit() {
    const targetUrl = "https://script.google.com/macros/s/AKfycbzM73d764og_Ke8BTTZQkRWgam-o1oub1vw26TahVzHBtopsiUvfOR3QyXliftKSEvvuw/exec";
    window.open(targetUrl, '_top');
  }

  window.onload = init;
</script>
</body>
</html>
